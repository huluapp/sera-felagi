<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ስራ ፈላጊ</title>
<style>
:root{
  --bg:#f3f6f8; --card:#ffffff; --ink:#14232e; --muted:#5b6b76;
  --line:#d9e1e7; --brand:#0b5d7a; --accent:#e0a200; --chip:#e4eef3;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0f1a21; --card:#172630; --ink:#e8f0f4; --muted:#9bb0bc; --line:#26394555; --brand:#5cc0e0; --accent:#f2b705; --chip:#1f3441;}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Noto Sans Ethiopic","Nyala",system-ui,-apple-system,"Segoe UI",sans-serif;
  line-height:1.5;padding-top:env(safe-area-inset-top)}
header{background:var(--brand);color:#fff;padding:18px 16px 20px}
header h1{margin:0 0 12px;font-size:22px}
.search{display:flex;gap:8px;max-width:720px;margin:0 auto}
.search input{flex:1;min-width:0;font:inherit;font-size:16px;padding:12px 14px;border:0;border-radius:10px;
  background:#fff;color:#14232e}
.search button{font:inherit;font-weight:600;padding:12px 18px;border:0;border-radius:10px;
  background:var(--accent);color:#14232e;cursor:pointer}
.wrap{max-width:720px;margin:0 auto}
.hint{margin:8px 0 0;font-size:13px;opacity:.85}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 16px;max-width:720px;margin:0 auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font:inherit;font-size:14px;padding:6px 14px;border-radius:999px;border:1px solid var(--line);
  background:var(--chip);color:var(--ink);cursor:pointer}
.chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
main{max-width:720px;margin:0 auto;padding:0 16px 40px}
.count{color:var(--muted);font-size:14px;margin:4px 0 12px}
.job{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.meta{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:13px;margin-bottom:8px}
.text{white-space:pre-wrap;word-break:break-word;font-size:15px;max-height:9.5em;overflow:hidden}
.job.open .text{max-height:none}
.row{display:flex;gap:16px;margin-top:10px}
.row button,.row a{font:inherit;font-size:14px;font-weight:600;color:var(--brand);background:none;border:0;padding:4px 0;cursor:pointer;text-decoration:none}
mark{background:var(--accent);color:#14232e;border-radius:3px;padding:0 2px}
.empty{text-align:center;color:var(--muted);padding:40px 16px}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>ስራ ፈላጊ</h1>
    <form class="search" id="form">
      <input id="q" list="positions" placeholder="የስራ ዓይነት ይምረጡ ወይም ይጻፉ" autocomplete="off" enterkeyhint="search">
      <button type="submit">ፈልግ</button>
    </form>
    <datalist id="positions">
      <option value="Nurse"><option value="ነርስ">
      <option value="Accountant"><option value="ሂሳብ ሹም">
      <option value="Manager"><option value="ሥራ አስኪያጅ">
      <option value="Driver"><option value="ሹፌር">
      <option value="Secretary"><option value="ፀሐፊ">
      <option value="Engineer"><option value="መሐንዲስ">
      <option value="Teacher"><option value="መምህር">
      <option value="Doctor"><option value="ሐኪም">
      <option value="Pharmacist"><option value="ፋርማሲስት">
      <option value="Cashier"><option value="ገንዘብ ተቀባይ">
      <option value="Sales"><option value="ሽያጭ">
      <option value="Marketing"><option value="Finance">
      <option value="Human Resource"><option value="Procurement">
      <option value="Software"><option value="IT">
      <option value="Security"><option value="Driver">
      <option value="Auditor"><option value="Logistics">
      <option value="Officer"><option value="Assistant">
    </datalist>
    <p class="hint">ከዝርዝሩ ይምረጡ ወይም የፈለጉትን ቃል ይጻፉ</p>
  </div>
</header>

<div class="chips" id="chips"></div>

<main>
  <div class="count" id="count"></div>
  <div id="list"></div>
</main>

<script>
const API = "https://job-api.huliyay4.workers.dev";
const QUICK = ["Nurse","Accountant","Manager","Driver","Secretary","Engineer","Teacher","Sales","IT"];

const $q = document.getElementById("q");
const $list = document.getElementById("list");
const $count = document.getElementById("count");
const $chips = document.getElementById("chips");

function esc(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function hl(text,q){
  const safe = esc(text);
  if(!q) return safe;
  const re = new RegExp("("+q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","gi");
  return safe.replace(re,"<mark>$1</mark>");
}
function fmtDate(d){
  if(!d) return "";
  const dt = new Date(d);
  return isNaN(dt) ? "" : dt.toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"});
}

function drawChips(active){
  $chips.innerHTML = "";
  QUICK.forEach(w=>{
    const b = document.createElement("button");
    b.type = "button";
    b.className = "chip" + (active.toLowerCase()===w.toLowerCase() ? " on" : "");
    b.textContent = w;
    b.onclick = ()=>{ $q.value = (active.toLowerCase()===w.toLowerCase()) ? "" : w; search(); };
    $chips.appendChild(b);
  });
}

async function search(){
  const q = $q.value.trim();
  drawChips(q);
  $count.textContent = "በመፈለግ ላይ…";
  $list.innerHTML = "";
  try{
    const res = await fetch(API + "/?q=" + encodeURIComponent(q));
    if(!res.ok) throw new Error(res.status);
    const jobs = await res.json();
    $count.textContent = q ? jobs.length + " ማስታወቂያ ተገኝቷል" : "የቅርብ ጊዜ " + jobs.length + " ማስታወቂያዎች";
    if(!jobs.length){
      $list.innerHTML = '<div class="empty">ለ"'+esc(q)+'" ምንም ማስታወቂያ አልተገኘም። ሌላ ቃል ይሞክሩ።</div>';
      return;
    }
    jobs.forEach(j=>{
      const el = document.createElement("div");
      el.className = "job";
      el.innerHTML =
        '<div class="meta"><span>@'+esc(j.channel)+'</span><span>'+fmtDate(j.date)+'</span></div>'+
        '<div class="text">'+hl(j.text,q)+'</div>'+
        '<div class="row"><button type="button" class="more">ሙሉውን አሳይ</button>'+
        '<a href="'+esc(j.link)+'" target="_blank" rel="noopener">በቴሌግራም ክፈት</a></div>';
      const more = el.querySelector(".more");
      more.onclick = ()=>{
        el.classList.toggle("open");
        more.textContent = el.classList.contains("open") ? "ጠቅለል አድርግ" : "ሙሉውን አሳይ";
      };
      $list.appendChild(el);
    });
  }catch(e){
    $count.textContent = "";
    $list.innerHTML = '<div class="empty">ማስታወቂያዎችን ማምጣት አልተቻለም። ኢንተርኔትዎን ያረጋግጡና እንደገና ይሞክሩ።</div>';
  }
}

document.getElementById("form").addEventListener("submit",e=>{e.preventDefault();search();});
$q.addEventListener("change",search);
search();
</script>
</body>
</html>
